application:
  test:
    name: name from cloud dev

MysQL:
  host: mysqlDb
  port: 3306
  database: billingAuthDb
  username: root
  password: root321
  
spring:
  profile:
    active: dev
  datasource:
    url: jdbc:mysql://${MysQL.host}:${MysQL.port}/${MysQL.database}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${MysQL.username}
    password: ${MysQL.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true 
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers" 
  endpoint:
    health:
      show-details: always

eureka:
    client:
        serviceUrl:
            defaultZone: http://eureka-server:8700/eureka/
        registerWithEureka: true
        fetchRegistry: false
    instance:
        preferIpAddress: true
        
springdoc:
  swagger-ui:
    path: /swagger-ui.html

feign:
  url: http://user-service:8902/
