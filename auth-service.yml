application:
  test:
    name: name from cloud dev

spring:
  profile:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true 
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers" 
  endpoint:
    health:
      show-details: always
