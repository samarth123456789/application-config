eureka:
    client:
        serviceUrl:
            defaultZone: http://eureka-server:8700/eureka/
        registerWithEureka: true
        fetchRegistry: true
    instance:
        preferIpAddress: true

spring:
  cloud:
    gateway:
      discovery:
        locator:
          # Automatically creates routes based on Eureka Service IDs
          enabled: true      
          lower-case-service-id: true
      
      # Explicit Custom Routing Rules
      routes:
        - id: user-service-route
        # "lb://" uses Eureka for load balancing
          uri: lb://USER-SERVICE 
          predicates:
            - Path=/users/**
            
#        - id: order-service-route
 #         uri: lb://ORDER-SERVICE
 #         predicates:
 #           - Path=/orders/**
